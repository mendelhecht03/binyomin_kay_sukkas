<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BKAY Owner Dashboard</title>
    <style>
      :root {
        --green: #0d4336;
        --green-2: #1d6551;
        --ink: #203e37;
        --muted: #64736d;
        --gold: #c47d2f;
        --cream: #fbf8f0;
        --surface: #ffffff;
        --line: #dce5df;
        --shadow: 0 12px 30px rgba(13, 67, 54, .08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--cream);
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      a { color: var(--green-2); }
      .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
      .topbar {
        color: white;
        background: var(--green);
        border-bottom: 5px solid var(--gold);
      }
      .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 0; }
      .eyebrow { margin: 0 0 4px; color: #e5b16b; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 0; font: 700 clamp(28px, 4vw, 42px)/1.1 Georgia, serif; }
      .topbar-note { margin: 4px 0 0; color: #d6e4df; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .refresh-button { border: 1px solid #c7ddd4; border-radius: 999px; padding: 10px 17px; color: var(--green); background: white; font-weight: 750; }
      .refresh-button:disabled { cursor: wait; opacity: .65; }
      .page { padding: 28px 0 60px; }
      .notice { display: none; margin-bottom: 20px; padding: 13px 16px; border: 1px solid #e8b0a6; border-radius: 12px; color: #7e271d; background: #fff2ef; }
      .notice.visible { display: block; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
      .tab { border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; color: var(--green); background: var(--surface); font-weight: 700; }
      .tab.active, .tab:hover { border-color: var(--green); color: white; background: var(--green); }
      .search { width: min(330px, 100%); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; color: var(--ink); background: white; }
      .search:focus { outline: 3px solid rgba(196, 125, 47, .25); border-color: var(--gold); }
      .view-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 14px; }
      .view-title h2 { margin-bottom: 0; font: 700 29px/1.2 Georgia, serif; color: var(--green); }
      .view-title span { color: var(--muted); }
      .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
      .kpi, .source-panel, .entry-card { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
      .kpi { padding: 18px; }
      .kpi-label { margin-bottom: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
      .kpi-value { color: var(--green); font-size: 30px; font-weight: 800; }
      .dashboard-grid { display: grid; grid-template-columns: 1.4fr .9fr; gap: 18px; }
      .source-panel { padding: 20px; }
      .source-panel h3 { margin-bottom: 8px; color: var(--green); font: 700 22px/1.2 Georgia, serif; }
      .source-panel p { color: var(--muted); }
      .source-links { display: flex; flex-wrap: wrap; gap: 9px; }
      .source-links a { border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; text-decoration: none; font-weight: 700; }
      .source-links a:hover { border-color: var(--gold); }
      .entries { display: grid; gap: 14px; }
      .entry-card { padding: 19px; }
      .entry-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
      .entry-head h3 { margin-bottom: 3px; color: var(--green); font-size: 18px; }
      .entry-meta { margin: 0; color: var(--muted); font-size: 13px; }
      .status { flex: 0 0 auto; border-radius: 999px; padding: 5px 9px; color: var(--green); background: #e8f2ed; font-size: 12px; font-weight: 800; }
      .status.pending-review { color: #7c4c16; background: #fff0d9; }
      .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
      .field { min-width: 0; }
      .field-label { margin-bottom: 2px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .02em; }
      .field-value { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .empty { padding: 34px 16px; border: 1px dashed #bdcec7; border-radius: 14px; color: var(--muted); background: rgba(255,255,255,.55); text-align: center; }
      .loading { color: var(--muted); }
      .updated { margin: 18px 0 0; color: var(--muted); font-size: 12px; text-align: right; }
      @media (max-width: 760px) {
        .shell { width: min(100% - 22px, 600px); }
        .topbar-inner, .toolbar { align-items: stretch; flex-direction: column; }
        .refresh-button, .search { width: 100%; }
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .dashboard-grid { grid-template-columns: 1fr; }
        .fields { grid-template-columns: 1fr; }
        .view-title { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <div>
          <p class="eyebrow">Benyamin Kay · private owner view</p>
          <h1>BKAY Owner Dashboard</h1>
          <p class="topbar-note">Review incoming builds, rentals, and testimonials in one place.</p>
        </div>
        <button id="refresh" class="refresh-button" type="button">Refresh entries</button>
      </div>
    </header>

    <main class="page shell">
      <div id="notice" class="notice" role="alert"></div>
      <div class="toolbar">
        <nav id="tabs" class="tabs" aria-label="Dashboard sections">
          <button class="tab active" type="button" data-view="overview">Overview</button>
          <button class="tab" type="button" data-view="builds">Builds</button>
          <button class="tab" type="button" data-view="rentals">Rentals</button>
          <button class="tab" type="button" data-view="testimonials">Testimonials</button>
        </nav>
        <input id="search" class="search" type="search" placeholder="Search entries" aria-label="Search entries">
      </div>
      <section id="app" aria-live="polite"><p class="loading">Loading entries…</p></section>
      <p id="updated" class="updated"></p>
    </main>

    <script>
      const accessKey = <?!= JSON.stringify(dashboardKey) ?>;
      const state = { data: null, view: "overview", query: "" };
      const app = document.getElementById("app");
      const notice = document.getElementById("notice");

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[character]));
      }

      function valueHtml(value) {
        const safe = escapeHtml(value);
        return safe.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      }

      function statusClass(status) {
        return String(status || "").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      }

      function allEntries() {
        if (!state.data) return [];
        return [
          ...state.data.builds.map((entry) => ({ ...entry, kind: "Build" })),
          ...state.data.rentals.map((entry) => ({ ...entry, kind: "Rental" })),
          ...state.data.testimonials.map((entry) => ({ ...entry, kind: "Testimonial" })),
        ];
      }

      function matches(entry) {
        if (!state.query) return true;
        const haystack = [entry.kind, entry.status, entry.submittedAt, entry.id]
          .concat(entry.fields.map((field) => [field.label, field.value]))
          .join(" ").toLowerCase();
        return haystack.includes(state.query);
      }

      function entryCard(entry) {
        const fields = entry.fields.map((field) => `
          <div class="field">
            <div class="field-label">${escapeHtml(field.label)}</div>
            <p class="field-value">${valueHtml(field.value)}</p>
          </div>
        `).join("");
        return `
          <article class="entry-card">
            <div class="entry-head">
              <div>
                <h3>${escapeHtml(entry.kind)} entry</h3>
                <p class="entry-meta">${escapeHtml(entry.submittedAt || "Date not provided")} · ${escapeHtml(entry.id)}</p>
              </div>
              <span class="status ${statusClass(entry.status)}">${escapeHtml(entry.status || "New")}</span>
            </div>
            <div class="fields">${fields || '<p class="entry-meta">No answer details were recorded.</p>'}</div>
          </article>
        `;
      }

      function entriesView(label, entries) {
        const filtered = entries.filter(matches);
        return `
          <div class="view-title"><h2>${label}</h2><span>${filtered.length} shown · ${entries.length} total</span></div>
          <div class="entries">${filtered.length ? filtered.map(entryCard).join("") : '<div class="empty">No matching entries yet.</div>'}</div>
        `;
      }

      function overviewView() {
        const data = state.data;
        const recent = allEntries().filter(matches).slice(0, 6);
        const errors = (data.errors || []).map((error) => `<li>${escapeHtml(error)}</li>`).join("");
        return `
          <div class="kpis">
            <div class="kpi"><div class="kpi-label">Build requests</div><div class="kpi-value">${data.builds.length}</div></div>
            <div class="kpi"><div class="kpi-label">Rental requests</div><div class="kpi-value">${data.rentals.length}</div></div>
            <div class="kpi"><div class="kpi-label">Testimonials</div><div class="kpi-value">${data.testimonials.length}</div></div>
            <div class="kpi"><div class="kpi-label">Pending reviews</div><div class="kpi-value">${data.testimonials.filter((entry) => /pending/i.test(entry.status)).length}</div></div>
          </div>
          <div class="dashboard-grid">
            <section><div class="view-title"><h2>Recent entries</h2><span>${recent.length} shown</span></div><div class="entries">${recent.length ? recent.map(entryCard).join("") : '<div class="empty">No matching entries yet.</div>'}</div></section>
            <aside class="source-panel">
              <h3>Keep the originals handy</h3>
              <p>The dashboard reads the same Forms and private Sheet as the current website integrations.</p>
              <div class="source-links">
                <a href="${data.sources.spreadsheetUrl}" target="_blank" rel="noopener">Open submissions Sheet</a>
                <a href="${data.sources.buildsFormUrl}" target="_blank" rel="noopener">Open Builds form</a>
                <a href="${data.sources.rentalsFormUrl}" target="_blank" rel="noopener">Open Rentals form</a>
              </div>
              ${errors ? `<p><strong>Source notes</strong></p><ul>${errors}</ul>` : ""}
            </aside>
          </div>
        `;
      }

      function render() {
        if (!state.data) return;
        if (state.view === "overview") app.innerHTML = overviewView();
        if (state.view === "builds") app.innerHTML = entriesView("Build requests", state.data.builds);
        if (state.view === "rentals") app.innerHTML = entriesView("Rental requests", state.data.rentals);
        if (state.view === "testimonials") app.innerHTML = entriesView("Testimonials", state.data.testimonials);
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === state.view));
      }

      function showError(message) {
        notice.textContent = message;
        notice.classList.add("visible");
        app.innerHTML = "";
      }

      function load() {
        notice.classList.remove("visible");
        app.innerHTML = '<p class="loading">Loading entries…</p>';
        document.getElementById("refresh").disabled = true;
        google.script.run
          .withSuccessHandler((data) => {
            state.data = data;
            document.getElementById("updated").textContent = `Last refreshed ${data.generatedAt}`;
            document.getElementById("refresh").disabled = false;
            render();
          })
          .withFailureHandler((error) => {
            document.getElementById("refresh").disabled = false;
            showError(error && error.message ? error.message : "The dashboard could not load.");
          })
          .getDashboardData(accessKey);
      }

      document.getElementById("refresh").addEventListener("click", load);
      document.getElementById("search").addEventListener("input", (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      document.getElementById("tabs").addEventListener("click", (event) => {
        const tab = event.target.closest("[data-view]");
        if (!tab) return;
        state.view = tab.dataset.view;
        render();
      });
      load();
    </script>
  </body>
</html>
